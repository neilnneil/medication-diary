<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f0">
  <meta name="description" content="貓砂與隱形眼鏡的使用及更換紀錄">
  <title>更換小記</title>
  <link rel="stylesheet" href="./styles.css?v=4">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="./app.js?v=5"></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">◌</span>更換小記</div>
      <button id="settingsButton" class="text-button" type="button">管理項目</button>
    </header>

    <section class="hero">
      <p class="eyebrow">每月更換紀錄</p>
      <h1>貓砂與隱形眼鏡</h1>
      <p>更換完成時按一下「更換」，就會記下現在的時間並算出下次預計更換日。</p>
    </section>
    <div id="undoNotice" class="undo-notice hidden" role="status" aria-live="polite"><span id="undoText"></span><button id="undoButton" type="button">復原</button></div>

    <section class="sync-card" aria-labelledby="syncTitle">
      <div><h2 id="syncTitle">Google 試算表同步</h2><p id="syncStatus" role="status" aria-live="polite"></p></div>
      <div class="sync-actions"><button id="connectButton" type="button">連結 Google</button><button id="cloudSettingsButton" type="button">同步設定</button></div>
    </section>

    <section aria-labelledby="itemsTitle">
      <div class="section-heading"><h2 id="itemsTitle">目前使用中</h2><span id="itemCount"></span></div>
      <div id="itemList" class="item-list"></div>
    </section>

    <section class="history-section" aria-labelledby="historyTitle">
      <div class="section-heading"><h2 id="historyTitle">最近紀錄</h2></div>
      <div id="historyList"></div>
    </section>

    <p class="footnote">每次「更換」會記錄當下時間；下次日期由更換週期計算。雲端同步完成前，紀錄仍只在這台裝置上。</p>
  </main>

  <dialog id="itemsDialog" class="sheet">
    <div class="sheet-header"><div><p class="eyebrow">週期設定</p><h2>管理項目</h2></div><button class="icon-button" id="closeItems" type="button" aria-label="關閉">×</button></div>
    <div id="settingsItems"></div>
    <button id="addItem" class="primary-button full" type="button">＋ 新增項目</button>
  </dialog>

  <dialog id="itemDialog" class="sheet small-sheet">
    <form id="itemForm">
      <div class="sheet-header"><div><p class="eyebrow">項目設定</p><h2 id="itemDialogTitle"></h2></div><button class="icon-button" id="closeItem" type="button" aria-label="關閉">×</button></div>
      <label class="field">名稱<input id="itemName" maxlength="60" required autocomplete="off" placeholder="例如：濾水器濾芯"></label>
      <div class="interval-fields"><label class="field">每隔<input id="intervalValue" type="number" min="1" max="365" value="1" required></label><label class="field">單位<select id="intervalUnit"><option value="months">個月</option><option value="weeks">週</option><option value="days">天</option></select></label></div>
      <p id="itemError" class="form-error" role="alert"></p>
      <button class="primary-button full" type="submit">儲存項目</button>
      <button id="archiveItem" class="danger-button full hidden" type="button">封存此項目</button>
    </form>
  </dialog>

  <dialog id="editRecordDialog" class="sheet small-sheet">
    <form id="editRecordForm">
      <div class="sheet-header"><div><p class="eyebrow">更正紀錄</p><h2 id="editRecordTitle"></h2></div><button class="icon-button" id="closeEditRecord" type="button" aria-label="關閉">×</button></div>
      <label class="field">更換／開始使用時間<input id="editRecordTime" type="datetime-local" required></label>
      <p class="hint">儲存後會重新計算下次更換日期；更正也會同步到原本的試算表。</p>
      <p id="editRecordError" class="form-error" role="alert"></p>
      <button class="primary-button full" type="submit">儲存修改</button>
    </form>
  </dialog>

  <dialog id="cloudDialog" class="sheet small-sheet">
    <form id="cloudForm">
      <div class="sheet-header"><div><p class="eyebrow">私人雲端紀錄</p><h2>Google 試算表</h2></div><button class="icon-button" id="closeCloud" type="button" aria-label="關閉">×</button></div>
      <p class="hint">每次更換只會在同一份試算表新增一列。換手機時，請複製這裡的網址，在新手機貼上後連結同一個 Google 帳號。網址中的長字串是檔案 ID。</p>
      <label class="field">試算表網址（換手機時貼上）<input id="sheetId" type="text" autocomplete="off" spellcheck="false" placeholder="貼上原本的試算表網址"></label>
      <button id="copySheetButton" class="secondary-button full hidden" type="button">複製試算表網址</button>
      <p id="copySheetStatus" class="hint" role="status" aria-live="polite"></p>
      <p id="cloudError" class="form-error" role="alert"></p>
      <button class="primary-button full" type="submit">儲存同步設定</button>
      <button id="createSheetButton" class="secondary-button full hidden" type="button">第一次使用：建立新的試算表</button>
      <a id="sheetLink" class="sheet-link hidden" target="_blank" rel="noopener noreferrer">開啟我的試算表 ↗</a>
    </form>
  </dialog>
</body>
</html>
